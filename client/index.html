<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale removed: blocking zoom is an accessibility fail and
         a Lighthouse demerit; we don't actually need a viewport lock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default metadata — pages can override per-route via document.title
         and a runtime meta-description hook. Required for SEO crawlers
         on the static HTML shell and the social-share previews. -->
    <title>Gallery — Jersey's life &amp; style magazine</title>
    <meta
      name="description"
      content="Gallery is Jersey's life and style magazine — in print since 2004. Read the latest features, fashion shoots, culture, events, paparazzi and business coverage from the Channel Islands."
    />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph / Twitter — sensible defaults so shares don't render
         as bare URLs. Per-article OG tags can be added later. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gallery" />
    <meta property="og:title" content="Gallery — Jersey's life &amp; style magazine" />
    <meta
      property="og:description"
      content="Jersey's life and style magazine. Print + online since 2004."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect to the R2 CDN so the TLS handshake is warm before the
         first hero image fetch fires. Lighthouse otherwise flags the
         cold-connection cost on every image-heavy page. -->
    <link rel="preconnect" href="https://pub-3b96f5fc8ba0456f9ffd861fc06e5e97.r2.dev" crossorigin />
    <link rel="dns-prefetch" href="https://pub-3b96f5fc8ba0456f9ffd861fc06e5e97.r2.dev" />

    <!-- Brand fonts are Georgia (serif) and Arial (sans) — both system
         fonts, no webfont request needed. The previous 40-family Google
         Fonts bundle was render-blocking dead weight (~14KB of CSS plus
         dozens of follow-up font requests, none of them used). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
